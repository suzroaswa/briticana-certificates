<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Briticana Certificate System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      color: #0f172a;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1e3a5f;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #64748b;
      margin-bottom: 32px;
      font-size: 15px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    input, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 18px;
      transition: border-color 0.15s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #1e3a5f;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 600px) {
      .row { grid-template-columns: 1fr; }
    }
    button {
      background: #1e3a5f;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s;
    }
    button:hover { background: #2c5282; }
    .result {
      display: none;
      margin-top: 20px;
    }
    .result.show { display: block; }
    .link-box {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px;
      word-break: break-all;
      font-size: 14px;
      color: #1e3a5f;
      margin-bottom: 12px;
    }
    .btn-secondary {
      background: #0f766e;
      margin-top: 10px;
    }
    .btn-secondary:hover { background: #0d9488; }
    .note {
      font-size: 13px;
      color: #64748b;
      margin-top: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Briticana Certificate Admin</h1>
    <p class="subtitle">Create a certificate and get a shareable link for the intern.</p>

    <div class="card">
      <div class="row">
        <div>
          <label>Candidate Full Name *</label>
          <input type="text" id="name" placeholder="e.g. Haseeb Abdulla Machingal" value="Haseeb Abdulla Machingal" />
        </div>
        <div>
          <label>Tenure *</label>
          <input type="text" id="tenure" placeholder="e.g. 3 months" value="3 months" />
        </div>
      </div>

      <label>Internship Name *</label>
      <input type="text" id="internship" placeholder="Full internship title" value="Hybrid Digital Twin & Autonomous Structural Integrity Framework" />

      <label>Reference ID (optional – auto generated if empty)</label>
      <input type="text" id="ref" placeholder="Leave empty to auto-generate BRIT-2026-XXXX" />

      <button onclick="createLink()">Generate Shareable Certificate Link</button>

      <div class="result" id="result">
        <p style="font-weight:600; margin-bottom:8px; color:#0f172a;">Share this link with the intern:</p>
        <div class="link-box" id="linkBox"></div>
        <button class="btn-secondary" onclick="copyLink()">Copy Link</button>
        <button class="btn-secondary" style="background:#1e3a5f; margin-top:8px;" onclick="openLink()">Open Certificate Page</button>
        <p class="note">
          The intern will see the exact certificate + 4 buttons:<br>
          Download PDF · Download JPG · LinkedIn Post · Add to LinkedIn Certificate
        </p>
      </div>
    </div>
  </div>

  <script>
    function generateRef() {
      const year = new Date().getFullYear();
      const rand = Math.random().toString(36).substring(2, 6).toUpperCase();
      return `BRIT-${year}-${rand}`;
    }

    function createLink() {
      const name = document.getElementById('name').value.trim();
      const internship = document.getElementById('internship').value.trim();
      const tenure = document.getElementById('tenure').value.trim();
      let ref = document.getElementById('ref').value.trim();

      if (!name || !internship || !tenure) {
        alert('Please fill Name, Internship and Tenure');
        return;
      }
      if (!ref) {
        ref = generateRef();
        document.getElementById('ref').value = ref;
      }

      const data = {
        n: name,
        i: internship,
        t: tenure,
        r: ref
      };

      // Encode as base64url
      const json = JSON.stringify(data);
      const b64 = btoa(unescape(encodeURIComponent(json)))
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/, '');

      const link = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '/') + 'view.html?d=' + b64;
      // fallback if opened as file
      const finalLink = link.includes('view.html') ? link : (window.location.href.replace(/\/[^/]*$/, '/') + 'view.html?d=' + b64);

      document.getElementById('linkBox').textContent = finalLink;
      document.getElementById('result').classList.add('show');
      window._lastLink = finalLink;
    }

    function copyLink() {
      navigator.clipboard.writeText(window._lastLink).then(() => {
        alert('Link copied!');
      }).catch(() => {
        prompt('Copy this link:', window._lastLink);
      });
    }

    function openLink() {
      window.open(window._lastLink, '_blank');
    }
  </script>
</body>
</html>
