<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Briticana Certificate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: #dce3eb;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 12px 50px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 18px;
    }
    .page-header h1 {
      font-size: 18px;
      font-weight: 700;
      color: #1e293b;
    }
    .page-header p {
      font-size: 13px;
      color: #64748b;
      margin-top: 2px;
    }

    #certificate-wrapper {
      background: #fff;
      box-shadow: 0 16px 48px rgba(0,0,0,0.14);
      line-height: 0;
    }

    #certificate {
      width: 1050px;
      height: 743px;
      background: #ffffff;
      position: relative;
      overflow: hidden;
    }

    .border-outer {
      position: absolute;
      inset: 16px;
      border: 3px solid #1a365d;
      z-index: 10;
      pointer-events: none;
    }
    .border-inner {
      position: absolute;
      inset: 24px;
      border: 1.5px solid #1a365d;
      z-index: 10;
      pointer-events: none;
    }

    .watermark {
      position: absolute;
      top: 52%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 390px;
      opacity: 0.08;
      z-index: 1;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 5;
      height: 100%;
      padding: 58px 90px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .title {
      font-family: 'UnifrakturMaguntia', cursive;
      font-size: 48px;
      color: #1a365d;
      line-height: 1.05;
      margin-bottom: 20px;
      letter-spacing: 0.3px;
    }

    .presented {
      font-family: 'Cormorant Garamond', 'EB Garamond', serif;
      font-size: 13px;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: #4a5568;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .candidate-name {
      font-family: 'Playfair Display', serif;
      font-size: 34px;
      font-weight: 700;
      color: #111827;
      border-bottom: 1.5px solid #1a365d;
      padding-bottom: 6px;
      margin-bottom: 4px;
      display: inline-block;
      min-width: 300px;
      letter-spacing: 0.2px;
    }

    .body-text {
      font-family: 'Cormorant Garamond', 'EB Garamond', serif;
      font-size: 16px;
      line-height: 1.55;
      color: #2d3748;
      max-width: 780px;
      margin-top: 26px;
      font-weight: 400;
    }
    .body-text .internship-name {
      font-weight: 600;
      color: #1a202c;
    }

    .footer-area {
      position: absolute;
      bottom: 58px;
      left: 78px;
      right: 78px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 6;
    }

    .barcode-area {
      width: 180px;
      height: 82px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
    }
    #barcodeCanvas {
      max-width: 172px;
      max-height: 78px;
      image-rendering: pixelated;
    }

    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2px;
    }
    .logo-area img {
      width: 96px;
      height: auto;
    }

    .signature-area {
      width: 200px;
      text-align: center;
    }
    .signature-area img {
      height: 52px;
      width: auto;
      display: block;
      margin: 0 auto 0;
    }
    .sig-line {
      border-top: 1px solid #718096;
      margin: 4px 18px 4px;
    }
    .sig-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      color: #1a202c;
      font-weight: 500;
    }
    .sig-title {
      font-size: 12px;
      color: #4a5568;
      margin-top: 1px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 28px;
      max-width: 1050px;
      width: 100%;
    }
    .actions button {
      flex: 1 1 210px;
      max-width: 250px;
      padding: 14px 16px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .actions button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
    .btn-pdf  { background: #b91c1c; }
    .btn-jpg  { background: #1d4ed8; }
    .btn-post { background: #0a66c2; }
    .btn-cert { background: #0077b5; }

    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 24px;
      border-radius: 12px;
      max-width: 480px;
      text-align: center;
      margin-top: 40px;
    }

    @media (max-width: 1100px) {
      #certificate { transform: scale(0.9); transform-origin: top center; }
      #certificate-wrapper { height: 669px; }
    }
    @media (max-width: 980px) {
      #certificate { transform: scale(0.78); }
      #certificate-wrapper { height: 580px; }
    }
    @media (max-width: 820px) {
      #certificate { transform: scale(0.62); }
      #certificate-wrapper { height: 461px; }
    }
    @media (max-width: 680px) {
      #certificate { transform: scale(0.48); }
      #certificate-wrapper { height: 357px; }
      .actions button { flex: 1 1 100%; max-width: none; }
    }
  </style>
</head>
<body>
  <div class="page-header">
    <h1>Your Briticana Certificate</h1>
    <p>Download or share your official Certificate of Participation</p>
  </div>

  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/gh/pkoretic/pdf417-generator@master/lib/pdf417.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    function getData() {
      const params = new URLSearchParams(window.location.search);
      const d = params.get('d');
      if (!d) return null;
      try {
        let b64 = d.replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        const json = decodeURIComponent(escape(atob(b64)));
        return JSON.parse(json);
      } catch (e) {
        console.error(e);
        return null;
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function renderCertificate(data) {
      const name = data.n;
      const internship = data.i;
      const tenure = data.t;
      const ref = data.r;

      const bodyHtml = `
        With sincere appreciation, this Certificate is awarded in recognition of the successful completion of the 
        <span class="internship-name">${escapeHtml(internship)}</span> internship (${escapeHtml(tenure)}).
        <br><br>
        It acknowledges the recipient's professionalism, dedication, commitment to continuous learning, and 
        successful completion of the prescribed internship program.
      `;

      document.getElementById('app').innerHTML = `
        <div id="certificate-wrapper">
          <div id="certificate">
            <div class="border-outer"></div>
            <div class="border-inner"></div>
            <img src="assets/logo.png" class="watermark" alt="" crossorigin="anonymous" />

            <div class="content">
              <div class="title">Certificate of Participation</div>
              <div class="presented">THIS CERTIFICATE IS PROUDLY PRESENTED TO</div>
              <div class="candidate-name">${escapeHtml(name)}</div>
              <div class="body-text">${bodyHtml}</div>
            </div>

            <div class="footer-area">
              <div class="barcode-area">
                <canvas id="barcodeCanvas" width="360" height="150"></canvas>
              </div>
              <div class="logo-area">
                <img src="assets/logo.png" alt="Briticana" crossorigin="anonymous" />
              </div>
              <div class="signature-area">
                <img src="assets/signature.png" alt="Signature" crossorigin="anonymous" />
                <div class="sig-line"></div>
                <div class="sig-name">Thilvas.Peter</div>
                <div class="sig-title">Project Head</div>
              </div>
            </div>
          </div>
        </div>

        <div class="actions">
          <button class="btn-pdf" onclick="downloadPDF()">📄 Download PDF</button>
          <button class="btn-jpg" onclick="downloadJPG()">🖼️ Download JPG</button>
          <button class="btn-post" onclick="linkedinPost()">🔗 LinkedIn Post</button>
          <button class="btn-cert" onclick="linkedinCertificate()">✅ Add LinkedIn Certificate</button>
        </div>
      `;

      const payload = [
        `NAME:${name}`,
        `REF:${ref}`,
        `ORG:Briticana`,
        `INTERNSHIP:${internship}`,
        `TENURE:${tenure}`
      ].join('|');

      const canvas = document.getElementById('barcodeCanvas');
      try {
        PDF417.draw(payload, canvas, 2.1, 4);
        canvas.style.width = '168px';
        canvas.style.height = 'auto';
      } catch (err) {
        console.error(err);
      }

      window._certData = data;
    }

    async function capture() {
      const el = document.getElementById('certificate');
      return html2canvas(el, {
        scale: 2.8,
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#ffffff',
        logging: false,
        width: 1050,
        height: 743
      });
    }

    async function downloadJPG() {
      const canvas = await capture();
      const a = document.createElement('a');
      a.download = `Briticana_Certificate_${window._certData.r}.jpg`;
      a.href = canvas.toDataURL('image/jpeg', 0.94);
      a.click();
    }

    async function downloadPDF() {
      const canvas = await capture();
      const img = canvas.toDataURL('image/jpeg', 0.94);
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({
        orientation: 'landscape',
        unit: 'px',
        format: [1050, 743]
      });
      pdf.addImage(img, 'JPEG', 0, 0, 1050, 743);
      pdf.save(`Briticana_Certificate_${window._certData.r}.pdf`);
    }

    function linkedinPost() {
      const { n, i } = window._certData;
      const text = encodeURIComponent(
        `Proud to share that I have successfully completed the "${i}" internship at Briticana!\n\n` +
        `This remote European internship provided valuable professional experience and growth.\n\n` +
        `#Briticana #RemoteInternship #EuropeanExperience #CertificateOfParticipation`
      );
      window.open(`https://www.linkedin.com/feed/?shareActive=true&text=${text}`, '_blank');
    }

    function linkedinCertificate() {
      const { i } = window._certData;
      const year = new Date().getFullYear();
      const month = new Date().getMonth() + 1;
      const params = new URLSearchParams({
        startTask: 'CERTIFICATION_NAME',
        name: i + ' Internship',
        organizationName: 'Briticana',
        issueYear: String(year),
        issueMonth: String(month)
      });
      window.open(`https://www.linkedin.com/profile/add?${params.toString()}`, '_blank');
    }

    const data = getData();
    if (!data || !data.n || !data.i || !data.t || !data.r) {
      document.getElementById('app').innerHTML = `
        <div class="error-box">
          <strong>Invalid or missing certificate link</strong><br><br>
          Please open the link that was shared with you by Briticana.
        </div>`;
    } else {
      renderCertificate(data);
    }
  </script>
</body>
</html>
