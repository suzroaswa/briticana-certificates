<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Briticana Certificate</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #dce3eb;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 12px 50px;
    }
    .header {
      text-align: center;
      margin-bottom: 16px;
    }
    .header h1 { font-size: 18px; font-weight: 700; color: #1e293b; }
    .header p { font-size: 13px; color: #64748b; margin-top: 2px; }

    #certificate {
      width: 1050px;
      height: 743px;
      background: #fff;
      position: relative;
      box-shadow: 0 16px 48px rgba(0,0,0,0.14);
      overflow: hidden;
    }
    #certificate img.bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }
    .overlay-name {
      position: absolute;
      top: 26.5%;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 700;
      color: #111827;
      border-bottom: 1.5px solid #1a365d;
      padding-bottom: 4px;
      white-space: nowrap;
      text-align: center;
      min-width: 280px;
      z-index: 5;
    }
    .overlay-body {
      position: absolute;
      top: 36%;
      left: 50%;
      transform: translateX(-50%);
      width: 78%;
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      line-height: 1.55;
      color: #2d3748;
      text-align: center;
      z-index: 5;
    }
    .overlay-body strong {
      font-weight: 600;
      color: #1a202c;
    }
    .barcode-overlay {
      position: absolute;
      bottom: 9.5%;
      left: 8.5%;
      width: 15.5%;
      z-index: 5;
    }
    .barcode-overlay canvas {
      width: 100%;
      height: auto;
      image-rendering: pixelated;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 28px;
      max-width: 1050px;
      width: 100%;
    }
    .actions button {
      flex: 1 1 200px;
      max-width: 240px;
      padding: 14px 16px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      transition: 0.15s;
    }
    .actions button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
    .btn-pdf  { background: #b91c1c; }
    .btn-jpg  { background: #1d4ed8; }
    .btn-post { background: #0a66c2; }
    .btn-cert { background: #0077b5; }

    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 24px;
      border-radius: 12px;
      max-width: 460px;
      text-align: center;
      margin-top: 40px;
    }

    @media (max-width: 1100px) {
      #certificate { transform: scale(0.88); transform-origin: top center; }
    }
    @media (max-width: 960px) {
      #certificate { transform: scale(0.72); }
    }
    @media (max-width: 780px) {
      #certificate { transform: scale(0.55); }
    }
    @media (max-width: 600px) {
      #certificate { transform: scale(0.42); }
      .actions button { flex: 1 1 100%; max-width: none; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Your Briticana Certificate</h1>
    <p>Download or share your official Certificate of Participation</p>
  </div>

  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/gh/pkoretic/pdf417-generator@master/lib/pdf417.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    function getData() {
      const params = new URLSearchParams(window.location.search);
      const d = params.get('d');
      if (!d) return null;
      try {
        let b64 = d.replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        return JSON.parse(decodeURIComponent(escape(atob(b64))));
      } catch (e) { return null; }
    }

    function render(data) {
      const { n: name, i: internship, t: tenure, r: ref } = data;

      document.getElementById('app').innerHTML = `
        <div id="certificate">
          <img class="bg" src="assets/template_clean.png" crossorigin="anonymous" alt="" />
          <div class="overlay-name">${name}</div>
          <div class="overlay-body">
            With sincere appreciation, this Certificate is awarded in recognition of the successful completion of the 
            <strong>${internship}</strong> internship (${tenure}).
            <br><br>
            It acknowledges the recipient's professionalism, dedication, commitment to continuous learning, and 
            successful completion of the prescribed internship program.
          </div>
          <div class="barcode-overlay">
            <canvas id="barcodeCanvas" width="300" height="120"></canvas>
          </div>
        </div>

        <div class="actions">
          <button class="btn-pdf" onclick="downloadPDF()">📄 Download PDF</button>
          <button class="btn-jpg" onclick="downloadJPG()">🖼️ Download JPG</button>
          <button class="btn-post" onclick="linkedinPost()">🔗 LinkedIn Post</button>
          <button class="btn-cert" onclick="linkedinCertificate()">✅ Add LinkedIn Certificate</button>
        </div>
      `;

      const payload = `NAME:${name}|REF:${ref}|ORG:Briticana|INTERNSHIP:${internship}|TENURE:${tenure}`;
      const canvas = document.getElementById('barcodeCanvas');
      try {
        PDF417.draw(payload, canvas, 1.9, 4);
      } catch(e) {}

      window._certData = data;
    }

    async function capture() {
      return html2canvas(document.getElementById('certificate'), {
        scale: 2.5,
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#ffffff',
        logging: false,
        width: 1050,
        height: 743
      });
    }

    async function downloadJPG() {
      const canvas = await capture();
      const a = document.createElement('a');
      a.download = `Briticana_Certificate_${window._certData.r}.jpg`;
      a.href = canvas.toDataURL('image/jpeg', 0.94);
      a.click();
    }

    async function downloadPDF() {
      const canvas = await capture();
      const img = canvas.toDataURL('image/jpeg', 0.94);
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'landscape', unit: 'px', format: [1050, 743] });
      pdf.addImage(img, 'JPEG', 0, 0, 1050, 743);
      pdf.save(`Briticana_Certificate_${window._certData.r}.pdf`);
    }

    function linkedinPost() {
      const { i } = window._certData;
      const text = encodeURIComponent(
        `Proud to share that I have successfully completed the "${i}" internship at Briticana!\n\n` +
        `This remote European internship provided valuable professional experience and growth.\n\n` +
        `#Briticana #RemoteInternship #EuropeanExperience #CertificateOfParticipation`
      );
      window.open(`https://www.linkedin.com/feed/?shareActive=true&text=${text}`, '_blank');
    }

    function linkedinCertificate() {
      const { i } = window._certData;
      const year = new Date().getFullYear();
      const month = new Date().getMonth() + 1;
      const params = new URLSearchParams({
        startTask: 'CERTIFICATION_NAME',
        name: i + ' Internship',
        organizationName: 'Briticana',
        issueYear: String(year),
        issueMonth: String(month)
      });
      window.open(`https://www.linkedin.com/profile/add?${params.toString()}`, '_blank');
    }

    const data = getData();
    if (!data || !data.n || !data.i || !data.t || !data.r) {
      document.getElementById('app').innerHTML = `
        <div class="error-box">
          <strong>Invalid or missing certificate link</strong><br><br>
          Please open the link shared with you by Briticana.
        </div>`;
    } else {
      render(data);
    }
  </script>
</body>
</html>
